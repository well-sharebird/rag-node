[project]
name = "rag-backend"
version = "0.1.0"
description = "RAG Backend Service"
requires-python = ">=3.10,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.33.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pymilvus>=2.5.0",
    "setuptools>=65.0.0",
    "redis[hiredis]>=5.2.0",
    "arq>=0.26.0",
    "minio>=7.2.0",
    "PyPDF2>=3.0.0",
    "python-docx>=1.1.0",
    "beautifulsoup4>=4.12.0",
    "markdown>=3.7",
    "crawl4ai>=0.3.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.18",
    "httpx>=0.28.0",
    "eval-type-backport>=0.2.0",
    "pdfplumber>=0.11.8",
    "openpyxl>=3.1.5",
    "python-pptx>=1.0.2",
    "python-jose[cryptography]>=3.5.0",
    "passlib[bcrypt]>=1.7.4",
    "email-validator>=2.3.0",
    "prometheus-client>=0.25.0",
    "elasticsearch>=9.1.3",
    "neo4j>=5.28.4",
    "aiokafka>=0.12.0",
    "chardet>=5.2.0",
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",
    "langdetect>=1.0.9",
    "simhash>=2.1.2",
    "pytesseract>=0.3.13",
    "pdf2image>=1.17.0",
    "Pillow>=10.0.0",
    "spacy>=3.7.0,<4.0.0",
    "hanlp>=2.1.0,<3.0.0",
    "aiohttp>=3.14.1",
    "semver>=3.0.4",
    "psycopg2-binary>=2.9.12",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
