[project]
name = "rag-backend"
version = "0.1.0"
description = "RAG Backend Service"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.33.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pymilvus>=2.5.0",
    "redis[hiredis]>=5.2.0",
    "arq>=0.26.0",
    "minio>=7.2.0",
    "PyPDF2>=3.0.0",
    "python-docx>=1.1.0",
    "beautifulsoup4>=4.12.0",
    "markdown>=3.7",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.18",
    "sentence-transformers>=3.3.0",
    "httpx>=0.28.0",
    "eval-type-backport>=0.2.0",
    "pdfplumber>=0.11.8",
    "openpyxl>=3.1.5",
    "python-pptx>=1.0.2",
    "python-jose[cryptography]>=3.5.0",
    "passlib[bcrypt]>=1.7.4",
    "email-validator>=2.3.0",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = []
